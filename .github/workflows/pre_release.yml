name: wheelbuild

on:
  push:
    branches:
      - "release-*"

permissions:
  contents: write

jobs:
  test-build-release-branch-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        #target: [x86_64, x86, aarch64, armv7, s390x, ppc64le]
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --manifest-path py-smelt/Cargo.toml --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
