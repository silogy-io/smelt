name: smoke

on:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  rust-test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v1
        with:
          key: "1"
      - run: cargo test
  slurm-py-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v2
      - name: Build and run Docker image
        run: |
          bash test_utils/exec_slurm_tests.sh
  py-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v1
        with:
          key: "1"
      - name: pytest
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          cd py-smelt && pip install -e . -v && cd -
          pip install pytest
          cd pytests && pytest .
