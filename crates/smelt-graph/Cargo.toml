[package]
name = "smelt-graph"
version.workspace = true
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
smelt-core = { workspace = true }
smelt-events = { workspace = true }
smelt-data = { workspace = true }
smelt-slurm = { path = "../smelt-slurm", artifact = "bin" }
anyhow = { workspace = true }
dice = { workspace = true }
allocative = { workspace = true }
dupe = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
derive_more = { workspace = true }
async-trait = { workspace = true }
fuzzy-matcher = { workspace = true }

static_interner = { workspace = true }
tonic = { workspace = true }


serde_json = { workspace = true }
tokio-stream = "0.1.15"
whoami = "1.5.1"
bollard = { version = "0.16.1", optional = true }
chrono = "0.4.38"
sha1 = "0.10.6"
hex.workspace = true
libproc = "0.14.8"
tracing = { workspace = true }
rand = "0.7.3"
tempfile = "3.12.0"
scc = "2.1.14"
aws-sdk-s3 = { version = "1.43.0", optional = true }
aws-config = { version = "1.5.5", optional = true }
aws-credential-types = { version = " 1.2.0", optional = true }
aws-types = { version = "1.3.3", optional = true }


[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies]
mach2 = "0.4.2"

[features]
default = ["docker", "s3"]
docker = ["dep:bollard"]
s3 = [
  "dep:aws-sdk-s3",
  "dep:aws-config",
  "dep:aws-credential-types",
  "dep:aws-types",
]
